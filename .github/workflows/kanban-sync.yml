name: Kanban Sync to GitHub Issues

on:
  push:
    branches: [main]
    paths:
      - 'kanban/**'
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not create/update issues)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  kanban-sync:
    uses: open-hax/eta-mu/.github/workflows/kanban-sync.yml@0823119585244bc5dfeea3c2b4cd64b0b0aa7cef # eta-mu main, 2026-08-02
    with:
      tasks-dir: kanban
      dry-run: ${{ github.event.inputs.dry_run == 'true' }}
      max-writes: 50
      write-delay-ms: 1000
    secrets:
      ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
      ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
