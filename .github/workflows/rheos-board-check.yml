name: Rheos Board Check

on:
  pull_request:
    paths:
      - "kanban/**"
      - ".github/workflows/rheos-board-check.yml"
  push:
    branches: [main]
    paths:
      - "kanban/**"
      - ".github/workflows/rheos-board-check.yml"
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rheos-board-check:
    permissions:
      contents: read
    uses: open-hax/eta-mu/.github/workflows/rheos-board-check.yml@rheos-board-check
    with:
      eta-mu-ref: rheos-board-check
      tasks-dir: kanban
      min-tasks: 1
      fail-on-drift: true
      artifact-name: knoxx-rheos-board-check
