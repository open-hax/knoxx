name: Production Release Preflight

# Application validation stays with Knoxx. Production deployment is centrally
# authorized by a reviewed open-hax/services PR carrying the `deploy` label and
# runs only through the DigitalOcean stack workflow. This workflow intentionally
# contains no deployment job.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Knoxx ref to validate
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Knoxx ref to validate for a centralized deployment
        required: false
        default: main
        type: string
    outputs:
      source_sha:
        description: Immutable Knoxx commit that passed the preflight
        value: ${{ jobs.production-preflight.outputs.source_sha }}

permissions:
  contents: read

env:
  # ubuntu runners ship a snap-wrapper /usr/bin/chromium-browser that hangs
  # under CI; point puppeteer-core at the real Chrome binary instead.
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

concurrency:
  group: knoxx-production-preflight
  cancel-in-progress: false

jobs:
  production-preflight:
    name: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout Knoxx
        uses: actions/checkout@v5
        with:
          repository: open-hax/knoxx
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Record validated source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13
        with:
          # backend/shadow-cljs.edn runs in :deps mode, so shadow-cljs resolves
          # its classpath (including the katamorph Git dependency) through
          # tools.deps and needs the clojure CLI on PATH.
          cli: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm -C backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Backend typecheck
        run: pnpm -C backend run typecheck

      - name: Backend tests with coverage
        run: pnpm -C backend run test:coverage

      - name: Frontend typecheck
        run: pnpm -C frontend run typecheck

      - name: Frontend tests with coverage
        run: pnpm -C frontend run test:coverage

      - name: Frontend build
        run: pnpm -C frontend run build
