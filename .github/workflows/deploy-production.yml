name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knoxx-production
  cancel-in-progress: false

jobs:
  production-preflight:
    name: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Knoxx
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm -C backend install --no-frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm -C frontend install --no-frozen-lockfile

      - name: Backend typecheck
        run: pnpm -C backend run typecheck

      - name: Backend tests with coverage
        run: pnpm -C backend run test:coverage

      - name: Frontend typecheck
        run: pnpm -C frontend run typecheck

      - name: Frontend tests with coverage
        run: pnpm -C frontend run test:coverage

      - name: Frontend build
        run: pnpm -C frontend run build

  deploy-production:
    name: deploy-production
    needs: production-preflight
    uses: open-hax/services/.github/workflows/deploy-promethean.yml@main
    with:
      environment: production
      service: knoxx
      source_repository: ${{ github.repository }}
      source_ref: ${{ github.sha }}
    secrets: inherit
