name: Apply PR 210 follow-up fixes

on:
  push:
    branches:
      - fix/pr-210-final-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pr-210-final-review
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def replace_regex(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, found {count}")
              return updated

          # CI credential persistence hardening.
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          text = replace_once(
              text,
              '          path: _deps/openplanner\n',
              '          path: _deps/openplanner\n          persist-credentials: false\n',
              'OpenPlanner checkout credentials')
          path.write_text(text)

          # Boundary schemas: require organization scope before entering storage.
          path = Path('backend/src/cljs/knoxx/backend/law/openplanner_translation.cljs')
          text = path.read_text()
          replacements = [
              ('''(def TenantScopeRequest
  [:map {:closed false}
   [:org_id {:optional true} OptionalString]])''', '''(def TenantScopeRequest
  [:map {:closed false}
   [:org_id NonBlankString]])''', 'TenantScopeRequest'),
              ('[:org_id {:optional true} OptionalString]\n   [:status', '[:org_id NonBlankString]\n   [:status', 'TranslationSegmentsRequest org'),
              ('[:org_id {:optional true} OptionalString]])\n\n(def LabelTranslationSegmentResponse', '[:org_id NonBlankString]])\n\n(def LabelTranslationSegmentResponse', 'LabelTranslationSegmentRequest org'),
              ('''(def LabelTranslationSegmentResponse
  [:map {:closed false}
   [:ok boolean?]
   [:label [:map {:closed false}]]''', '''(def LabelTranslationSegmentResponse
  [:map {:closed false}
   [:ok boolean?]
   [:label_id NonBlankString]
   [:label [:map {:closed false}]]''', 'LabelTranslationSegmentResponse label_id'),
              ('''(def TranslationManifestRequest
  [:or
   NonBlankString
   [:map {:closed false}
    [:project {:optional true} OptionalString]
    [:org_id {:optional true} OptionalString]]])''', '''(def TranslationManifestRequest
  [:map {:closed false}
   [:project {:optional true} OptionalString]
   [:org_id NonBlankString]])''', 'TranslationManifestRequest'),
              ('[:org_id {:optional true} OptionalString]\n   [:include_corrected', '[:org_id NonBlankString]\n   [:include_corrected', 'TranslationSftRequest org'),
              ('[:segments [:vector BatchTranslationSegmentRequest]]\n   [:org_id {:optional true} OptionalString]', '[:segments [:vector BatchTranslationSegmentRequest]]\n   [:org_id NonBlankString]', 'CreateTranslationSegmentsBatchRequest org'),
              ('[:garden_id {:optional true} OptionalString]\n   [:org_id {:optional true} OptionalString]])\n\n(def TranslationDocumentsResponse', '[:garden_id {:optional true} OptionalString]\n   [:org_id NonBlankString]])\n\n(def TranslationDocumentsResponse', 'TranslationDocumentsRequest org'),
              ('[:overall LabelOverall]\n   [:org_id {:optional true} OptionalString]', '[:overall LabelOverall]\n   [:org_id NonBlankString]', 'ReviewTranslationDocumentRequest org'),
              ('''   [:project {:optional true} OptionalString]
   [:org_id {:optional true} OptionalString]])

(def CreateTranslationBatchResponse''', '''   [:project {:optional true} OptionalString]
   [:org_id NonBlankString]
   [:membership_id NonBlankString]])

(def CreateTranslationBatchResponse''', 'CreateTranslationBatchRequest scope'),
              ('[:status {:optional true} OptionalString]\n   [:org_id {:optional true} OptionalString]])\n\n(def TranslationBatchesResponse', '[:status {:optional true} OptionalString]\n   [:org_id NonBlankString]])\n\n(def TranslationBatchesResponse', 'TranslationBatchesRequest org'),
              ('[:status [:enum "processing" "complete" "partial" "failed"]]\n   [:org_id {:optional true} OptionalString]', '[:status [:enum "processing" "complete" "partial" "failed"]]\n   [:org_id NonBlankString]', 'UpdateTranslationBatchRequest org'),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          path.write_text(text)

          # Route-created batches retain the exact membership that owns the org scope.
          path = Path('backend/src/cljs/knoxx/backend/infra/routes/translation.cljs')
          text = path.read_text()
          text = replace_once(
              text,
              '''(defn- org-scope
  [ctx ctx-org-id]
  {:org_id (org-id! ctx ctx-org-id)})''',
              '''(defn- org-scope
  [ctx ctx-org-id]
  {:org_id (org-id! ctx ctx-org-id)})

(defn- membership-id!
  [ctx ctx-membership-id]
  (or (some-> (ctx-membership-id ctx) str str/trim not-empty)
      (throw (http-error 403
                         "membership_context_required"
