                                   :membership_id (membership-id! ctx ctx-membership-id)}))))''',
              'batch membership route')
          path.write_text(text)

          # Translation worker uses the batch owner's membership for all Knoxx calls.
          path = Path('ingestion/src/kms_ingestion/translation/worker.clj')
          text = path.read_text()
          text = replace_once(
              text,
              '''(defn- knoxx-headers
  []
  (let [api-key (config/knoxx-api-key)
        user-email (config/knoxx-user-email)]
    (cond-> {"Content-Type" "application/json"
