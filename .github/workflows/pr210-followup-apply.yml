          text = replace_once(text, '(defn- ^:async upsert-graph-memory!\n  [collections segment corrected-text]', '(defn- ^:async upsert-graph-memory!\n  [cs segment corrected-text]', 'graph memory shadow')
          text = text.replace('(:graph-nodes collections)', '(:graph-nodes cs)').replace('(:graph-edges collections)', '(:graph-edges cs)')

