              'worker Knoxx headers')
          text = replace_once(
              text,
              '''(defn- fetch-knoxx-segments
  [project document-id source-lang target-lang]
  (fetch-json (str (knoxx-url "/api/translations/segments")
                   "?project=" (url-encode project)
                   "&document_id=" (url-encode document-id)
                   "&source_lang=" (url-encode source-lang)
                   "&target_lang=" (url-encode target-lang)
                   "&limit=100")
              (knoxx-headers)))''',
              '''(defn- fetch-knoxx-segments
  [membership-id project document-id source-lang target-lang]
  (fetch-json (str (knoxx-url "/api/translations/segments")
                   "?project=" (url-encode project)
                   "&document_id=" (url-encode document-id)
                   "&source_lang=" (url-encode source-lang)
                   "&target_lang=" (url-encode target-lang)
                   "&limit=100")
              (knoxx-headers membership-id)))''',
              'worker segment fetch')
          text = replace_once(
              text,
              '''  [project document-id source-lang target-lang initial-total timeout-ms]
  (let [deadline (+ (System/currentTimeMillis) timeout-ms)]
    (loop []
      (let [result (try (fetch-knoxx-segments project document-id source-lang target-lang)''',
              '''  [membership-id project document-id source-lang target-lang initial-total timeout-ms]
  (let [deadline (+ (System/currentTimeMillis) timeout-ms)]
    (loop []
      (let [result (try (fetch-knoxx-segments membership-id project document-id source-lang target-lang)''',
              'worker wait scope')
          text = replace_once(
              text,
              '''        project (:project batch)
        source-lang (:source_lang batch "en")
        target-lang (:target_lang batch)
        document-ids (:document_ids batch)]''',
              '''        project (:project batch)
        org-id (:org_id batch)
        membership-id (:membership_id batch)
        source-lang (:source_lang batch "en")
        target-lang (:target_lang batch)
        document-ids (:document_ids batch)]''',
              'worker batch scope bindings')
          text = replace_once(
              text,
              '''    (try
      ;; Mark batch as processing''',
              '''    (try
      (when (str/blank? (str org-id))
        (throw (ex-info "Translation batch is missing org_id" {:batch-id batch-id})))
      (when (str/blank? (str membership-id))
        (throw (ex-info "Translation batch is missing membership_id" {:batch-id batch-id :org-id org-id})))

      ;; Mark batch as processing''',
              'worker fail closed')
          text = replace_once(
              text,
              ''':resource_policies {:project project
                                                                :garden_id garden-id
                                                                :source_lang source-lang
                                                                :target_lang target-lang}}''',
              ''':resource_policies {:project project
                                                                :garden_id garden-id
                                                                :org_id org-id
                                                                :source_lang source-lang
                                                                :target_lang target-lang}}''',
              'worker resource org')
          text = replace_once(text, '(knoxx-headers)\n                                  agent-request)', '(knoxx-headers membership-id)\n                                  agent-request)', 'worker direct start membership')
          text = replace_once(text, '(fetch-knoxx-segments project doc-id source-lang target-lang)', '(fetch-knoxx-segments membership-id project doc-id source-lang target-lang)', 'worker initial segment fetch')
          text = replace_once(text, '(wait-for-new-segments project doc-id source-lang target-lang initial-total (* 180000 (count valid-docs)))', '(wait-for-new-segments membership-id project doc-id source-lang target-lang initial-total (* 180000 (count valid-docs)))', 'worker wait call')
          path.write_text(text)

          # Direct Mongo boundary fixes.
          path = Path('backend/src/cljs/knoxx/backend/extern/openplanner_translation_mongo.cljs')
          text = path.read_text()
          text = replace_once(text, '(defn- jget\n  [obj key]\n  (when obj (aget obj key)))', '(defn- jget\n  [obj property]\n  (when obj (aget obj property)))', 'jget shadow')
          text = replace_once(text, '(let [key (jget index "key")]', '(let [index-key (jget index "key")]', 'index key shadow')
          text = text.replace('(and key\n', '(and index-key\n', 1).replace('(js/Object.keys key)', '(js/Object.keys index-key)', 1).replace('(jget key field)', '(jget index-key field)', 1)
          text = replace_once(
              text,
              '''(defn- ^:async create-indexes!
  [db]
  (let [{:keys [segments labels batches]} (collections db)]
    (await (ensure-segment-unique-index! segments))
    (await (js/Promise.all
            #js [(.createIndex segments #js {"status" 1})
                 (.createIndex segments #js {"target_lang" 1})
                 (.createIndex segments #js {"garden_id" 1})
                 (.createIndex segments #js {"org_id" 1})
                 (.createIndex segments #js {"project" 1})
                 (.createIndex labels #js {"segment_id" 1 "created_at" -1})
                 (.createIndex batches #js {"garden_id" 1 "target_lang" 1 "status" 1})
                 (.createIndex batches #js {"org_id" 1 "status" 1 "created_at" 1})]))
    true))

(defn ^:async ensure-indexes!
  []
  (if-let [pending @index-promise*]
    (await pending)
    (let [pending (create-indexes! (await (db!)))]
      (reset! index-promise* pending)
      (try
        (await pending)
        (catch :default err
          (reset! index-promise* nil)
          (throw err))))))

(defn- filter-map
  [source keys]
  (reduce (fn [result key]
            (if-let [value (get source key)]
              (assoc result key value)
              result))
          {}
          keys))''',
              '''(defn- ^:async backfill-label-scope!
  [labels]
  ;; Existing labels predate denormalized tenant fields. Backfill them from the
  ;; authoritative segment before manifest queries rely on the indexed scope.
  (await (.toArray
          (.aggregate labels
                      (clj->js [{:$match {:$or [{:org_id {:$exists false}}
                                                {:org_id nil}]}}
                                {:$addFields {:segment_object_id
                                              {:$convert {:input "$segment_id"
                                                          :to "objectId"
                                                          :onError nil
                                                          :onNull nil}}}}
                                {:$lookup {:from segment-collection-name
                                           :localField "segment_object_id"
                                           :foreignField "_id"
                                           :as "segment"}}
                                {:$unwind "$segment"}
                                {:$set {:org_id "$segment.org_id"
                                        :project "$segment.project"}}
                                {:$project {:segment 0 :segment_object_id 0}}
                                {:$merge {:into label-collection-name
                                          :on "_id"
                                          :whenMatched "merge"
                                          :whenNotMatched "discard"}}])))))

(defn- ^:async create-indexes!
  [db]
  (let [{:keys [segments labels batches]} (collections db)]
    (await (ensure-segment-unique-index! segments))
    (await (.createIndex labels #js {"segment_id" 1 "created_at" -1}))
    (await (backfill-label-scope! labels))
    (await (js/Promise.all
            #js [(.createIndex segments #js {"status" 1})
                 (.createIndex segments #js {"target_lang" 1})
                 (.createIndex segments #js {"garden_id" 1})
                 (.createIndex segments #js {"org_id" 1})
                 (.createIndex segments #js {"project" 1})
                 (.createIndex labels #js {"org_id" 1 "project" 1})
                 (.createIndex batches #js {"garden_id" 1 "target_lang" 1 "status" 1})
                 (.createIndex batches #js {"org_id" 1 "status" 1 "created_at" 1})]))
    true))

(defn- ^:async init-indexes!
  []
  (await (create-indexes! (await (db!)))))

(defn ^:async ensure-indexes!
  "Ensure translation indexes and label-scope backfill once; returns true."
  []
  (if-let [pending @index-promise*]
    (await pending)
    (let [pending (init-indexes!)]
      (reset! index-promise* pending)
      (try
        (await pending)
        (catch :default err
          (reset! index-promise* nil)
          (throw err))))))

(defn- filter-map
  [source field-keys]
  (reduce (fn [result field]
            (if-let [value (get source field)]
              (assoc result field value)
              result))
          {}
          field-keys))

(defn- normalized-query-number
  [value default-value lower-bound upper-bound]
  (let [parsed (js/Number (or value default-value))
        finite (if (js/Number.isFinite parsed) parsed default-value)
        bounded (max lower-bound (js/Math.floor finite))]
    (if upper-bound (min upper-bound bounded) bounded)))''',
              'indexes, backfill, and helpers')
          text = replace_once(text, ':org_id (jget row "org_id")\n     :status', ':org_id (jget row "org_id")\n     :membership_id (jget row "membership_id")\n     :status', 'batch membership view')

          text = replace_regex(
              text,
              r'\(defn \^:async list-segments!.*?\n\(defn \^:async segment!',
              '''(defn ^:async list-segments!
  "List tenant-scoped translation segments; returns {:segments :total :has_more}."
  [opts]
  (await (ensure-indexes!))
  (let [request (contract/assert-valid! :translation-segments/request
                                        contract/TranslationSegmentsRequest
                                        (or opts {}))
        org-id (required-org-id! (:org_id request))
        selector (assoc (filter-map request [:project :status :source_lang :target_lang :domain :document_id])
                        :org_id org-id)
        limit (normalized-query-number (:limit request) 50 1 100)
        offset (normalized-query-number (:offset request) 0 0 nil)
        {:keys [segments labels]} (collections (await (db!)))
        rows (await (.toArray (-> (.find segments (clj->js selector))
                                  (.sort #js {"created_at" 1})
                                  (.skip offset)
                                  (.limit limit))))
        ids (mapv string-id (array-seq rows))
        count-rows (if (seq ids)
                     (await (.toArray
                             (.aggregate labels
                                         (clj->js [{:$match {:segment_id {:$in ids}}}
                                                   {:$group {:_id "$segment_id" :count {:$sum 1}}}]))))
                     #js [])
        count-by-id (into {} (map (fn [row] [(jget row "_id") (jget row "count")])
                                  (array-seq count-rows)))
        total (await (.countDocuments segments (clj->js selector)))
        response {:segments (mapv #(segment-view % [] (get count-by-id (string-id %) 0))
                                  (array-seq rows))
                  :total total
                  :has_more (< (+ offset (.-length rows)) total)}]
    (assert-response! :translation-segments/response contract/TranslationSegmentsResponse response)))

(defn ^:async segment!''',
              'list-segments replacement')

          text = replace_regex(
