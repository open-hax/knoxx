(defn- override-for''',
              'document fallback replacement')

          review_helpers = '''(defn- bulk-result-count
  [result field fallback]
  (let [value (or (jget result field)
                  (some-> (jget result "result") (jget field)))]
    (if (number? value) value fallback)))

(defn- bulk-error-indexes
  [err operation-count]
  (let [getter (jget err "getWriteErrors")
        write-errors (or (jget err "writeErrors")
                         (when (fn? getter) (.call getter err))
                         #js [])
        indexes (into #{} (keep #(jget % "index")) (array-seq write-errors))]
    (if (seq indexes) indexes (into #{} (range operation-count)))))

(defn- ^:async bulk-write!
  [collection operations]
  (if-not (seq operations)
    {:result nil :failed-indexes #{}}
    (try
      {:result (await (.bulkWrite collection (clj->js operations) #js {"ordered" false}))
       :failed-indexes #{}}
      (catch :default err
        {:result (or (jget err "result") err)
         :failed-indexes (bulk-error-indexes err (count operations))}))))

(defn- ^:async graph-results-in-chunks
  [cs plans]
  (loop [remaining plans
         results []]
    (if (seq remaining)
      (let [chunk (vec (take 20 remaining))
            chunk-results (await (js/Promise.all
                                  (clj->js
                                   (mapv (fn [{:keys [segment label next-status]}]
                                           (if (= next-status "approved")
                                             (upsert-graph-memory! cs segment (:corrected_text label))
                                             (js/Promise.resolve {:success true})))
                                         chunk))))]
        (recur (drop 20 remaining)
               (into results (map #(if (map? %)
                                     %
                                     (js->clj % :keywordize-keys true))
                                  (array-seq chunk-results)))))
      results)))

(defn- ^:async review-plan!
  [cs org-id request overrides now segment operation-index]
  (let [segment-id (string-id segment)
        selector #js {"_id" (jget segment "_id") "org_id" org-id}
        version (await (next-label-version! (:segments cs) (:labels cs) selector segment-id))
        override (override-for overrides segment)
        plan (translation/document-review-label-plan
              {:segment-id segment-id
               :labeler-id (:labeler_id request)
               :labeler-email (:labeler_email request)
               :overall (or (:overall override) (:overall request))
               :corrected-text (:corrected_text override)
               :editor-notes (or (:editor_notes override)
                                 (:editor_notes request))})]
    {:operation-index operation-index
     :segment segment
     :label (assoc (dissoc plan :next_status)
                   :org_id org-id
                   :project (jget segment "project")
                   :label_version version
                   :created_at now)
     :next-status (:next_status plan)}))

'''
          text = replace_once(text, '(defn ^:async review-document!\n', review_helpers + '(defn ^:async review-document!\n', 'review helpers insertion')
          text = replace_regex(
              text,
              r'\(defn \^:async review-document!.*?\n\(defn \^:async create-batch!',
              '''(defn ^:async review-document!
  "Review all segments in a tenant document; returns accurate successful and failed counts."
  [document-id target-lang payload]
  (await (ensure-indexes!))
  (let [request (contract/assert-valid! :review-translation-document/request
                                        contract/ReviewTranslationDocumentRequest
                                        (or payload {}))
        org-id (required-org-id! (:org_id request))
        cs (collections (await (db!)))
        selector {:document_id (str document-id)
                  :target_lang (str target-lang)
                  :org_id org-id}
        segment-array (await (.toArray
                              (-> (.find (:segments cs) (clj->js selector))
                                  (.sort #js {"segment_index" 1}))))
        segments (vec (array-seq segment-array))]
    (when-not (seq segments)
      (throw (js/Error. "No segments found for this document+language pair")))
    (let [overrides (or (:segment_overrides request) {})
          now (js/Date.)
          plan-array (await (js/Promise.all
                             (clj->js
                              (map-indexed (fn [operation-index segment]
                                             (review-plan! cs org-id request overrides now segment operation-index))
                                           segments))))
          plans (vec (array-seq plan-array))
          label-operations (mapv (fn [{:keys [label]}]
                                   {:insertOne {:document label}})
                                 plans)
          label-write (await (bulk-write! (:labels cs) label-operations))
          label-failed (:failed-indexes label-write)
          eligible (vec (remove #(contains? label-failed (:operation-index %)) plans))
          segment-operations (mapv (fn [{:keys [segment label next-status]}]
                                     {:updateOne
                                      {:filter {:_id (jget segment "_id") :org_id org-id}
                                       :update {:$set (cond-> {:status next-status
                                                              :updated_at now}
                                                       (:corrected_text label)
                                                       (assoc :translated_text (:corrected_text label)))}}})
                                   eligible)
          segment-write (await (bulk-write! (:segments cs) segment-operations))
          segment-failed-local (:failed-indexes segment-write)
          segment-failed (into #{}
                               (keep (fn [local-index]
                                       (some-> (nth eligible local-index nil) :operation-index)))
                               segment-failed-local)
          known-completed (vec (remove #(contains? segment-failed (:operation-index %)) eligible))
          label-success (bulk-result-count (:result label-write)
                                           "insertedCount"
                                           (- (count plans) (count label-failed)))
          segment-success (bulk-result-count (:result segment-write)
                                             "matchedCount"
                                             (- (count eligible) (count segment-failed)))
          reviewed-count (min (count known-completed) label-success segment-success)
          completed-plans (vec (take reviewed-count known-completed))
          graph-results (await (graph-results-in-chunks cs completed-plans))
          graph-failures (count (remove :success graph-results))
          response {:ok true
                    :document_id (str document-id)
                    :target_lang (str target-lang)
                    :segments_reviewed reviewed-count
                    :segments_failed (- (count plans) reviewed-count)
                    :overall (:overall request)
                    :overrides_applied (count overrides)
                    :graph_memory_failures graph-failures}]
      (assert-response! :review-translation-document/response
                        contract/ReviewTranslationDocumentResponse
                        response))))

