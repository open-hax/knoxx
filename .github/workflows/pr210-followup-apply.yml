              '''(defn ^:async manifest!
  "Build a tenant-scoped translation manifest; returns language, labeler, and export statistics."
  [opts]
  (await (ensure-indexes!))
  (let [request (contract/assert-valid! :translation-export-manifest/request
                                        contract/TranslationManifestRequest
                                        (or opts {}))
        org-id (required-org-id! (:org_id request))
        segment-selector (assoc (filter-map request [:project]) :org_id org-id)
        label-selector (cond-> {:org_id org-id}
                         (:project request) (assoc :project (:project request)))
        {:keys [segments labels]} (collections (await (db!)))
        language-rows (await (.toArray
                              (.aggregate segments
                                          (clj->js [{:$match segment-selector}
                                                    {:$group {:_id "$target_lang"
                                                              :total {:$sum 1}
                                                              :approved {:$sum {:$cond [{:$eq ["$status" "approved"]} 1 0]}}
                                                              :rejected {:$sum {:$cond [{:$eq ["$status" "rejected"]} 1 0]}}
                                                              :pending {:$sum {:$cond [{:$eq ["$status" "pending"]} 1 0]}}
                                                              :in_review {:$sum {:$cond [{:$eq ["$status" "in_review"]} 1 0]}}}}]))))
        label-rows (await (.toArray
