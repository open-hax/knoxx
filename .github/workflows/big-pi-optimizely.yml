name: Big Pi local Optimizely

on:
  pull_request:
    paths:
      - 'packages/big-pi-optimizely/**'
      - 'scripts/*big-pi*'
      - '.github/workflows/big-pi-optimizely.yml'
  push:
    branches: [main]
    paths:
      - 'packages/big-pi-optimizely/**'
      - 'scripts/*big-pi*'
      - '.github/workflows/big-pi-optimizely.yml'

permissions:
  contents: read

jobs:
  local-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/big-pi-optimizely
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/big-pi-optimizely/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: big-pi-browser-tour
          path: packages/big-pi-optimizely/screenshots
          if-no-files-found: ignore
