name: eta-mu evidence review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Reusable workflow calls run with `none` unless the caller grants scopes;
# the called jobs request contents:read and pull-requests:read.
permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Evidence-first review (eta-mu)
    # Consume the reviewed full-input/native-publication integration.
    uses: open-hax/eta-mu/.github/workflows/opencode-code-review.yml@d98ab446d56ddfd24542df49b102b851f2a767fa
    with:
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      opencode_version: '1.18.31'
      setup_eta_mu_toolchain: false
      evidence_gates_script: |
        run_gate qualifier_python_env python3 -m venv "$RUNNER_TEMP/knoxx-qualification-python"
        run_gate qualifier_python_dependencies "$RUNNER_TEMP/knoxx-qualification-python/bin/python" -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'
        run_gate qualifier_repository "$RUNNER_TEMP/knoxx-qualification-python/bin/python" scripts/test-production-checkout.py
        run_gate human_verifier_preconditions python3 scripts/test-cms-verifier-preconditions.py
        run_gate human_verifier_syntax bash -n scripts/verify-cms-source-locale-review.sh
        run_gate cms_history_verifier_syntax bash -n scripts/verify-cms-history.sh
        run_gate diff_check git diff --check "${PR_BASE_SHA}...HEAD"
    # Least privilege: forward only the secrets the review job consumes.
    secrets:
      ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
      ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
